<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shutters Calculator Tests</title>
  <style>
    body{max-width:760px;margin:40px auto;padding:0 20px;font:16px/1.5 system-ui;color:#153f3a}h1{font-family:Georgia,serif}.result{padding:12px 15px;margin:8px 0;border-radius:9px}.pass{background:#e1f2e8}.fail{background:#fbe5e3}code{font-size:13px}
  </style>
</head>
<body>
  <h1>Calculation tests</h1>
  <p id="summary">Running…</p>
  <div id="results"></div>
  <script type="module">
    import {
      INCH_TO_METRE,
      ITEM_BLIND,
      ITEM_SHUTTER,
      UNIT_INCHES,
      UNIT_METRES,
      parseDecimal,
      calculateBlindItem,
      calculateItem,
      calculateQuote,
      convertItemMeasurements,
      formatMeasurementInput,
      normalizeItemType,
      normalizeStoredItem,
      normalizeUnit
    } from "./calculator.js";
    import { BLIND_BANDS, BLIND_PRICE_BANDS, BLIND_WIDTHS, validateBlindPriceTable } from "./blind-prices.js";
    const tests = [];
    const test = (name, fn) => tests.push({ name, fn });
    const near = (actual, expected, epsilon = 1e-10) => { if (Math.abs(actual - expected) > epsilon) throw new Error(`expected ${expected}, got ${actual}`); };
    const equal = (actual, expected) => { if (actual !== expected) throw new Error(`expected ${expected}, got ${actual}`); };

    test("Converts inches to metres", () => near(40 * INCH_TO_METRE, 1.016));
    test("Accepts comma decimals", () => equal(parseDecimal("40,5"), 40.5));
    test("Accepts point decimals", () => equal(parseDecimal("40.5"), 40.5));
    test("Rejects missing dimensions", () => equal(calculateItem({width:"",height:"20",material:"wood",tilt:"standard"},{woodPrice:100,surcharge:25}).valid, false));
    test("Rejects zero dimensions", () => equal(calculateItem({width:"0",height:"20",material:"wood",tilt:"standard"},{woodPrice:100,surcharge:25}).valid, false));
    test("Calculates area without intermediate rounding", () => {
      const result = calculateItem({width:"40.5",height:"50.25",material:"wood",tilt:"standard"},{woodPrice:100,pvcPrice:50,surcharge:25});
      near(result.area, (40.5 * .0254) * (50.25 * .0254));
    });
    test("Uses distinct Wood and PVC rates", () => {
      const wood = calculateItem({width:40,height:50,material:"wood",tilt:"standard"},{woodPrice:120,pvcPrice:80,surcharge:25});
      const pvc = calculateItem({width:40,height:50,material:"pvc",tilt:"standard"},{woodPrice:120,pvcPrice:80,surcharge:25});
      equal(wood.rate, 120); equal(pvc.rate, 80);
    });
    test("Adds a 25% Hidden Tilt surcharge", () => {
      const result = calculateItem({width:40,height:50,material:"wood",tilt:"hidden"},{woodPrice:100,surcharge:25});
      near(result.surcharge, result.basePrice * .25); near(result.total, result.basePrice * 1.25);
    });
    test("Totals multiple items", () => {
      const quote = calculateQuote([
        {width:40,height:50,material:"wood",tilt:"hidden"},
        {width:30,height:60,material:"pvc",tilt:"standard"}
      ], {woodPrice:100,pvcPrice:80,surcharge:25});
      equal(quote.itemCount, 2); near(quote.total, quote.subtotal + quote.surcharge);
    });
    test("Zero price remains a valid calculation", () => {
      const result = calculateItem({width:40,height:50,material:"wood",tilt:"hidden"},{woodPrice:0,surcharge:25});
      equal(result.valid, true); equal(result.total, 0);
    });
    test("39.3700787 inches is approximately one metre", () => {
      const inches = calculateItem({width:39.3700787,height:39.3700787,unit:UNIT_INCHES,material:"wood",tilt:"standard"},{woodPrice:100,surcharge:25});
      const metres = calculateItem({width:1,height:1,unit:UNIT_METRES,material:"wood",tilt:"standard"},{woodPrice:100,surcharge:25});
      near(inches.area, metres.area, 1e-6); near(inches.total, metres.total, 1e-6);
    });
    test("Switching one shutter from inches to metres preserves area and price", () => {
      const item = {width:"48,25",height:"36.5",unit:UNIT_INCHES,material:"wood",tilt:"hidden"};
      const before = calculateItem(item,{woodPrice:120,surcharge:25});
      const converted = convertItemMeasurements(item,UNIT_INCHES,UNIT_METRES);
      const after = calculateItem(converted,{woodPrice:120,surcharge:25});
      near(after.area,before.area); near(after.total,before.total);
    });
    test("Switching one shutter back to inches preserves area and price", () => {
      const item = {width:1.22555,height:.9271,unit:UNIT_METRES,material:"wood",tilt:"hidden"};
      const before = calculateItem(item,{woodPrice:120,surcharge:25});
      const converted = convertItemMeasurements(item,UNIT_METRES,UNIT_INCHES);
      const after = calculateItem(converted,{woodPrice:120,surcharge:25});
      near(after.area,before.area); near(after.total,before.total);
    });
    test("Old saved shutter items without a unit default to inches", () => {
      const reloaded = JSON.parse(JSON.stringify({customer:"Legacy",items:[{width:40,height:50}]}));
      equal(normalizeUnit(reloaded.items[0].unit),UNIT_INCHES);
    });
    test("Each shutter's selected unit restores after reload", () => {
      const reloaded = JSON.parse(JSON.stringify({customer:"Metric",items:[{unit:UNIT_METRES}]}));
      equal(normalizeUnit(reloaded.items[0].unit),UNIT_METRES);
    });
    test("A temporary global saved unit migrates to each shutter", () => {
      const reloaded = JSON.parse(JSON.stringify({unit:UNIT_METRES,items:[{width:1,height:1}]}));
      equal(normalizeUnit(reloaded.items[0].unit ?? reloaded.unit),UNIT_METRES);
    });
    test("Converted inputs use sensible trimmed formatting", () => {
      equal(formatMeasurementInput(1.23456789,UNIT_METRES),"1.234568");
      equal(formatMeasurementInput(40,UNIT_INCHES),"40");
    });
    test("Each shutter in a mixed-unit quote uses its own unit", () => {
      const quote = calculateQuote([
        {width:39.3700787,height:39.3700787,unit:UNIT_INCHES,material:"wood",tilt:"standard"},
        {width:1,height:1,unit:UNIT_METRES,material:"wood",tilt:"standard"}
      ],{woodPrice:100,surcharge:25});
      equal(quote.itemCount,2); near(quote.results[0].area,1,1e-6); near(quote.results[1].area,1); near(quote.total,200,1e-6);
    });
    test("Blind price tables have consistent dimensions", () => {
      equal(validateBlindPriceTable(),true); equal(BLIND_WIDTHS.length,16);
      for(const band of BLIND_BANDS){equal(BLIND_PRICE_BANDS[band].prices.length,BLIND_PRICE_BANDS[band].drops.length);for(const row of BLIND_PRICE_BANDS[band].prices)equal(row.length,16);}
    });
    test("Exact blind dimensions select the exact cell", () => {
      const result=calculateBlindItem({type:ITEM_BLIND,widthMm:1670,dropMm:2438,band:"C"});
      equal(result.chargedWidth,1670);equal(result.chargedDrop,2438);equal(result.basePrice,231);
    });
    test("Blind width between columns selects the next larger width", () => {
      equal(calculateBlindItem({type:ITEM_BLIND,widthMm:1600,dropMm:2000,band:"C"}).chargedWidth,1670);
    });
    test("Blind drop between rows selects the next larger drop", () => {
      equal(calculateBlindItem({type:ITEM_BLIND,widthMm:1600,dropMm:2000,band:"C"}).chargedDrop,2438);
    });
    test("Bands A through G return distinct prices", () => {
      const prices=BLIND_BANDS.map(band=>calculateBlindItem({type:ITEM_BLIND,widthMm:1600,dropMm:2000,band}).basePrice);
      equal(new Set(prices).size,7);
    });
    test("Bands A and B support Drop 1219", () => {
      for(const band of ["A","B"])equal(calculateBlindItem({type:ITEM_BLIND,widthMm:508,dropMm:1219,band}).chargedDrop,1219);
    });
    test("Bands C through G use 1727 as their minimum Drop", () => {
      for(const band of ["C","D","E","F","G"])equal(calculateBlindItem({type:ITEM_BLIND,widthMm:508,dropMm:1219,band}).chargedDrop,1727);
    });
    test("Blind width above 3455 is out of range", () => {
      const result=calculateBlindItem({type:ITEM_BLIND,widthMm:3455.01,dropMm:2000,band:"A"});equal(result.outOfRange,true);equal(result.total,0);
    });
    test("Blind drop above 3302 is out of range", () => {
      const result=calculateBlindItem({type:ITEM_BLIND,widthMm:1600,dropMm:3302.01,band:"A"});equal(result.outOfRange,true);equal(result.total,0);
    });
    test("Blind price adds exactly ten percent", () => {
      const result=calculateBlindItem({type:ITEM_BLIND,widthMm:1600,dropMm:2000,band:"C"});
      equal(result.basePrice,231);near(result.surcharge,23.10);near(result.total,254.10);
    });
    test("Blind total contributes to a mixed quotation Grand Total", () => {
      const result=calculateQuote([
        {type:ITEM_SHUTTER,width:1,height:1,unit:UNIT_METRES,material:"wood",tilt:"standard"},
        {type:ITEM_BLIND,widthMm:1600,dropMm:2000,band:"C"}
      ],{woodPrice:100,pvcPrice:80,surcharge:25});
      near(result.shuttersSubtotal,100);near(result.blindsSubtotal,254.10);near(result.total,354.10);
    });
    test("Out-of-range blind is excluded from Grand Total", () => {
      const result=calculateQuote([
        {type:ITEM_SHUTTER,width:1,height:1,unit:UNIT_METRES,material:"wood",tilt:"standard"},
        {type:ITEM_BLIND,widthMm:4000,dropMm:2000,band:"A"}
      ],{woodPrice:100,surcharge:25});near(result.total,100);
    });
    test("Legacy items without type restore as shutters", () => {
      equal(normalizeItemType(undefined),ITEM_SHUTTER);equal(normalizeStoredItem({id:"legacy",width:40,height:50}).type,ITEM_SHUTTER);
    });
    test("Blind items preserve required localStorage fields", () => {
      const saved={id:"b",type:ITEM_BLIND,name:"Office",widthMm:"1600",dropMm:"2000",band:"C"};
      const restored=normalizeStoredItem(JSON.parse(JSON.stringify(saved)));equal(JSON.stringify(restored),JSON.stringify(saved));
    });
    test("Deleting a blind updates Grand Total", () => {
      const shutter={id:"s",type:ITEM_SHUTTER,width:1,height:1,unit:UNIT_METRES,material:"wood",tilt:"standard"};
      const blind={id:"b",type:ITEM_BLIND,widthMm:1600,dropMm:2000,band:"C"};
      const before=calculateQuote([shutter,blind],{woodPrice:100,surcharge:25});
      const after=calculateQuote([shutter],{woodPrice:100,surcharge:25});near(before.total,354.10);near(after.total,100);
    });
    test("Reset quotation contains no blind totals", () => {
      const reset=calculateQuote([{type:ITEM_SHUTTER,width:"",height:"",unit:UNIT_INCHES,material:"wood",tilt:"standard"}],{woodPrice:100,surcharge:25});
      equal(reset.blindCount,0);equal(reset.total,0);
    });

    let passed = 0;
    for (const entry of tests) {
      const row = document.createElement("div");
      try { entry.fn(); passed++; row.className = "result pass"; row.textContent = `✓ ${entry.name}`; }
      catch (error) { row.className = "result fail"; row.innerHTML = `✗ ${entry.name}<br><code>${error.message}</code>`; }
      document.querySelector("#results").append(row);
    }
    document.querySelector("#summary").textContent = `${passed}/${tests.length} tests passed`;
    document.title = passed === tests.length ? `PASS · ${passed}/${tests.length}` : `FAIL · ${passed}/${tests.length}`;
  </script>
</body>
</html>
